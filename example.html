<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Аким на 5 часов — пример выбора мероприятий</title>
  <link rel="stylesheet" href="./scenario-picker.css">
  <style>
    body { margin: 0; background: #f4f7f9; font-family: system-ui, sans-serif; color: #182d3b; }
    main { max-width: 1150px; margin: auto; padding: 32px 20px; }
    h1 { margin: 0 0 8px; }
    .intro { margin: 0 0 24px; }
    #final-result { white-space: pre-wrap; overflow-wrap: anywhere; }
    textarea { display: block; width: 100%; max-width: 650px; margin: 8px 0 20px; padding: 10px; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Аким на 5 часов</h1>
    <p class="intro">Соберите пять мероприятий в пределах бюджета 100 единиц. Балл пересчитывается при каждом изменении.</p>
    <div id="measures"></div>
    <label for="other-codes">Коды других результатов для сравнения (до 10, каждый с новой строки)</label>
    <textarea id="other-codes" rows="3" placeholder="A1:5.2,7.4,8.4,10.4,12"></textarea>
    <p id="scenario-code"></p>
    <output id="final-result" aria-live="polite"></output>
  </main>
  <script type="module">
    import { mountScenarioPicker } from './scenario-picker.js';
    import { encodeScenario } from './score.js';
    import { analyzeScenario } from './analysis.js';
    const root = document.getElementById('measures');
    const output = document.getElementById('final-result');
    const codeOutput = document.getElementById('scenario-code');
    const others = document.getElementById('other-codes');
    let pending;
    const cancel = () => {
      pending?.abort(); pending = null;
      output.textContent = ''; codeOutput.textContent = '';
    };
    root.addEventListener('scenariochange', cancel);
    others.addEventListener('input', cancel);
    root.addEventListener('scenariofinalize', async () => {
      if (pending) return; // Повторный щелчок не создаёт второй запрос.
      const decisions = component.scenario.getState().decisions;
      codeOutput.textContent = `Ваш код: ${encodeScenario(decisions)}`;
      const request = pending = new AbortController();
      output.textContent = 'ИИ анализирует подтверждённые решения…';
      try {
        const result = await analyzeScenario(decisions, others.value.split(/\s+/).filter(Boolean), { signal: request.signal });
        if (!request.signal.aborted) output.textContent = result.analysis;
      } catch (error) {
        if (!request.signal.aborted) output.textContent = error.message;
      } finally { if (pending === request) pending = null; }
    });
    const component = mountScenarioPicker(root);
  </script>
</body>
</html>
